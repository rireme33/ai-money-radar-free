name: Collect public AI leads
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'  # JST 09:15, scheduled jobs may be delayed
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect public RSS
        run: python scripts/collect.py
      - name: Save only changed output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/leads.json
          git diff --cached --quiet || (git commit -m 'Update AI leads' && git push)
